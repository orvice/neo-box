syntax = "proto3";

package neobox.v1;

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "go.orx.me/apps/neo-box/pkg/proto/neobox/v1;neoboxv1";

// WasabiService shows the daily usage and estimated cost of Wasabi
// connections, synced from the Wasabi Stats API. Connections themselves are
// managed by ConnectionService; connection_id must name one of the caller's
// Wasabi connections. Days are UTC, written YYYY-MM-DD.
service WasabiService {
  // GetWasabiOverview returns the newest account totals, the cost estimate,
  // and the sync state.
  rpc GetWasabiOverview(GetWasabiOverviewRequest) returns (GetWasabiOverviewResponse);
  // ListWasabiBuckets lists buckets with their newest day of usage.
  rpc ListWasabiBuckets(ListWasabiBucketsRequest) returns (ListWasabiBucketsResponse);
  // GetWasabiUsage returns the daily usage of the account or one bucket.
  rpc GetWasabiUsage(GetWasabiUsageRequest) returns (GetWasabiUsageResponse);
  // SyncWasabiConnection re-fetches the last 7 days in the background (a
  // backfill first, if it has not finished).
  rpc SyncWasabiConnection(SyncWasabiConnectionRequest) returns (SyncWasabiConnectionResponse);
  // GetWasabiCostBreakdown splits the cost estimate's period by what the
  // charge pays for (active storage, deleted storage still billed, the 1 TB
  // minimum) and by bucket, at the connection's price.
  rpc GetWasabiCostBreakdown(GetWasabiCostBreakdownRequest) returns (GetWasabiCostBreakdownResponse);
}

// WasabiUsage is one day of Stats API utilization. Storage fields are a
// snapshot at midnight UTC; activity fields cover that day.
message WasabiUsage {
  string day = 1;
  // Empty for the account as a whole.
  string bucket = 2;
  string region = 3;
  // Billable active storage: padded object bytes plus metadata.
  int64 active_storage_bytes = 4;
  // Deleted data still billed under the minimum storage duration.
  int64 deleted_storage_bytes = 5;
  int64 billable_objects = 6;
  int64 billable_deleted_objects = 7;
  int64 raw_storage_bytes = 8;
  int64 padded_storage_bytes = 9;
  int64 metadata_storage_bytes = 10;
  int64 orphaned_storage_bytes = 11;
  int64 min_storage_charge_bytes = 12;
  int64 api_calls = 13;
  int64 upload_bytes = 14;
  // Egress.
  int64 download_bytes = 15;
  int64 storage_wrote_bytes = 16;
  int64 storage_read_bytes = 17;
  int64 delete_bytes = 18;
  int64 get_calls = 19;
  int64 put_calls = 20;
  int64 delete_calls = 21;
  int64 list_calls = 22;
  int64 head_calls = 23;
}

// WasabiCostEstimate is an estimate from Wasabi's published formulas, not
// an invoice.
message WasabiCostEstimate {
  string period_start = 1;
  string period_end = 2;
  // No billing-cycle anchor: the period is the last 30 days and
  // projected_cost is a monthly run rate.
  bool rolling = 3;
  // Newest day with data in the period; empty when there is none.
  string data_through = 4;
  int32 days_with_data = 5;
  // USD.
  double cost_to_date = 6;
  // USD; the whole period, with days lacking data filled from the newest.
  double projected_cost = 7;
  double price_per_tb_month = 8;
  int64 egress_bytes = 9;
  // Egress above the average active storage: outside Wasabi's free-egress
  // allowance.
  bool egress_exceeds_storage = 10;
  // Whether enough recent days (7 of the last 30) were synced to fit a
  // trend to the daily charges.
  bool trend_fitted = 11;
  // projected_cost with the days not synced yet following that trend
  // instead of repeating the newest day; equal to it without a trend.
  double trend_projected_cost = 12;
  // The following 30-day cycle on the same trend; 0 for a rolling period.
  double next_cycle_cost = 13;
  // The connection's budget per billing cycle; 0 means none.
  double budget_usd = 14;
}

message WasabiSyncState {
  // A sync is queued or running.
  bool syncing = 1;
  google.protobuf.Timestamp last_success_at = 2;
  // Newest day with account data; empty before the first sync.
  string last_synced_day = 3;
  bool backfill_complete = 4;
  // Share of the 12-month backfill done, 0..1.
  double backfill_progress = 5;
  // When bucket settings were last read through the S3 API.
  google.protobuf.Timestamp config_fetched_at = 6;
  // Why buckets could not be listed: "access_denied" when the key lacks
  // S3 read access, otherwise an error message. Empty when they were.
  string config_error = 7;
}

message WasabiBucket {
  string name = 1;
  string region = 2;
  // The bucket is missing from the newest day of data.
  bool deleted = 3;
  WasabiUsage latest = 4;
  // The bucket's settings, once read; absent before the first read or for
  // a bucket the S3 API no longer lists.
  WasabiBucketConfig config = 5;
}

// WasabiBucketConfig is a bucket's settings as last read through the S3
// API. An absent message means the setting is off (or has no rules); a
// setting that could not be read has an entry in errors instead.
message WasabiBucketConfig {
  google.protobuf.Timestamp fetched_at = 1;
  // When the bucket was created.
  google.protobuf.Timestamp created_at = 2;
  // The region the bucket lives in.
  string region = 3;
  WasabiVersioning versioning = 4;
  WasabiObjectLock object_lock = 5;
  WasabiCompliance compliance = 6;
  repeated WasabiLifecycleRule lifecycle_rules = 7;
  WasabiBucketPolicy policy = 8;
  WasabiBucketAcl acl = 9;
  WasabiBucketLogging logging = 10;
  repeated WasabiReplicationRule replication_rules = 11;
  map<string, string> tags = 12;
  // Setting ("versioning", "object_lock", "compliance", "lifecycle",
  // "policy", "acl", "logging", "replication", "tags", "location") to why
  // it could not be read: "access_denied", "not_supported", or a message.
  map<string, string> errors = 13;
  // The policy or ACL lets anyone in. Wasabi's console "Public Access
  // Override" can't be read through the API, so false doesn't rule it out.
  bool public = 14;
  // Settings worth a look, most severe first.
  repeated WasabiBucketFinding findings = 15;
}

message WasabiVersioning {
  // "Enabled" or "Suspended".
  string status = 1;
  bool mfa_delete = 2;
}

message WasabiObjectLock {
  // "GOVERNANCE" or "COMPLIANCE" when a default retention is set.
  string mode = 1;
  int32 days = 2;
  int32 years = 3;
}

// WasabiCompliance is Wasabi's own retention setting; a bucket has it or
// Object Lock, never both.
message WasabiCompliance {
  int32 retention_days = 1;
  bool conditional_hold = 2;
  bool delete_after_retention = 3;
  // The settings can no longer be reduced.
  bool locked = 4;
  google.protobuf.Timestamp lock_time = 5;
}

// WasabiLifecycleRule is one lifecycle rule; zero day counts mean the action
// is not set.
message WasabiLifecycleRule {
  string id = 1;
  bool enabled = 2;
  string prefix = 3;
  int32 expiration_days = 4;
  bool expired_object_delete_marker = 5;
  int32 noncurrent_days = 6;
  int32 abort_multipart_days = 7;
}

message WasabiBucketPolicy {
  // The policy JSON.
  string document = 1;
  bool public = 2;
}

message WasabiBucketAcl {
  string owner = 1;
  repeated WasabiAclGrant grants = 2;
  bool public = 3;
}

message WasabiAclGrant {
  // A user's name or ID, or a group URI.
  string grantee = 1;
  string permission = 2;
}

message WasabiBucketLogging {
  string target_bucket = 1;
  string target_prefix = 2;
}

message WasabiReplicationRule {
  string id = 1;
  bool enabled = 2;
  string prefix = 3;
  string destination_bucket = 4;
}

enum WasabiFindingSeverity {
  WASABI_FINDING_SEVERITY_UNSPECIFIED = 0;
  WASABI_FINDING_SEVERITY_INFO = 1;
  WASABI_FINDING_SEVERITY_WARNING = 2;
  WASABI_FINDING_SEVERITY_CRITICAL = 3;
}

message WasabiBucketFinding {
  // "public_policy", "public_acl", "old_versions_kept",
  // "versioning_suspended", or "settings_unreadable".
  string code = 1;
  WasabiFindingSeverity severity = 2;
  string message = 3;
}

message GetWasabiOverviewRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
}

message GetWasabiOverviewResponse {
  // Newest day of account totals; unset before any data arrived.
  WasabiUsage latest = 1;
  // Unset when the estimate is disabled for the connection.
  WasabiCostEstimate cost_estimate = 2;
  WasabiSyncState sync = 3;
  // Buckets present on the newest day.
  int32 bucket_count = 4;
}

message ListWasabiBucketsRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Also list buckets that are gone from the newest day of data.
  bool include_deleted = 2;
}

message ListWasabiBucketsResponse {
  repeated WasabiBucket buckets = 1;
}

message GetWasabiUsageRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Empty for account totals.
  string bucket = 2;
  // Inclusive; empty means 90 days before `to`.
  string from = 3;
  // Inclusive; empty means today.
  string to = 4;
}

message GetWasabiUsageResponse {
  // Oldest first; days without data are absent.
  repeated WasabiUsage days = 1;
}

message SyncWasabiConnectionRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
}

message SyncWasabiConnectionResponse {
  WasabiSyncState sync = 1;
}

// WasabiBucketCost is one bucket's share of a period's charge, in USD.
message WasabiBucketCost {
  string bucket = 1;
  string region = 2;
  // The bucket has no row on the period's newest day.
  bool deleted = 3;
  double active_cost = 4;
  // Deleted data still billed under the minimum storage duration.
  double deleted_cost = 5;
  // From the bucket's newest day in the period.
  int64 active_storage_bytes = 6;
  int64 deleted_storage_bytes = 7;
  // Bytes deleted during the period.
  int64 deleted_in_period_bytes = 8;
}

// WasabiCostBreakdown splits the cost estimate's period, in USD. Active,
// deleted and minimum add up to the estimate's cost to date. Wasabi doesn't
// say whether bucket figures add up to the account's, so what the buckets
// don't explain is unattributed_cost (negative when they add up to more).
message WasabiCostBreakdown {
  string period_start = 1;
  string period_end = 2;
  bool rolling = 3;
  string data_through = 4;
  int32 days_with_data = 5;
  double price_per_tb_month = 6;
  double active_cost = 7;
  double deleted_cost = 8;
  // Tops active storage up to the 1 TB minimum.
  double minimum_cost = 9;
  double unattributed_cost = 10;
  // Highest total first.
  repeated WasabiBucketCost buckets = 11;
}

message GetWasabiCostBreakdownRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
}

message GetWasabiCostBreakdownResponse {
  WasabiCostBreakdown breakdown = 1;
}

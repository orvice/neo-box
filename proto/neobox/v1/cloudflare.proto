// --- Workers and Pages management ---

enum CloudflareResourceKind {
  CLOUDFLARE_RESOURCE_KIND_UNSPECIFIED = 0;
  CLOUDFLARE_RESOURCE_KIND_WORKER = 1;
  CLOUDFLARE_RESOURCE_KIND_PAGES = 2;
  CLOUDFLARE_RESOURCE_KIND_EMAIL_ROUTING = 3;
}

// CloudflareResourceOperation is one change to a Worker, a Pages project,
// or a Zone's Email Routing started from Neo Box. It never holds a secret
// value.
message CloudflareResourceOperation {
  string id = 1;
  string connection_id = 2;
  string account_id = 3;
  CloudflareResourceKind kind = 4;
  // Worker script or Pages project name, or the Zone name for Email Routing.
  string resource = 5;
  // e.g. attach_domain, add_route, put_secret, rollback, delete.
  string action = 6;
  // What the action applies to: a hostname, route pattern, secret or
  // variable name, version or deployment ID.
  string target = 7;
  google.protobuf.Struct before = 8;
  // Unset for anything that did not succeed.
  google.protobuf.Struct after = 9;
  CloudflareOperationStatus status = 10;
  string error = 11;
  string actor_id = 12;
  string actor_name = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  google.protobuf.Struct requested = 16;
}

// CloudflareChangeResult is what every Worker, Pages, and Email Routing
// change returns.
message CloudflareChangeResult {
  // False when there was nothing to do (already so); no operation is
  // logged then.
  bool changed = 1;
  CloudflareResourceOperation operation = 2;
  // Set when the change was made but its outcome could not be logged.
  string operation_log_error = 3;
}

message CloudflareWorkerDomain {
  string hostname = 1;
  string zone_id = 2;
  string zone_name = 3;
  bool enabled = 4;
}

message CloudflareWorkerRoute {
  string id = 1;

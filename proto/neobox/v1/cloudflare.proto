  string author_email = 5;
}

message CloudflareWorkerDeploymentVersion {
  string version_id = 1;
  double percentage = 2;
}

message CloudflareWorkerDeployment {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  string source = 3;
  string message = 4;
  string author_email = 5;
  repeated CloudflareWorkerDeploymentVersion versions = 6;

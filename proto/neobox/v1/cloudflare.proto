syntax = "proto3";

package neobox.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "go.orx.me/apps/neo-box/pkg/proto/neobox/v1;neoboxv1";

// CloudflareService reads the resources the API token of a Cloudflare
// connection can see in the connection's Account (Zones, DNS records,
// Workers, Pages projects, Tunnels), changes DNS records, and manages
// cloudflared Tunnels and their public hostnames. Everything is read live
// from Cloudflare; only DNS operations started here are stored.
//
// connection_id must be the caller's Cloudflare connection; anything else
// is NotFound. A module the token has no permission for fails with
// PermissionDenied; a token Cloudflare no longer accepts fails with
// FailedPrecondition and marks the connection's status as error.
service CloudflareService {
  // ListCloudflareZones pages through the Account's Zones, optionally those
  // whose name contains query.
  rpc ListCloudflareZones(ListCloudflareZonesRequest) returns (ListCloudflareZonesResponse);
  rpc GetCloudflareZone(GetCloudflareZoneRequest) returns (GetCloudflareZoneResponse);
  // ListCloudflareDNSRecords pages through a Zone's DNS records, optionally
  // those matching query.
  rpc ListCloudflareDNSRecords(ListCloudflareDNSRecordsRequest) returns (ListCloudflareDNSRecordsResponse);
  rpc CreateCloudflareDNSRecord(CreateCloudflareDNSRecordRequest) returns (CreateCloudflareDNSRecordResponse);
  // UpdateCloudflareDNSRecord changes the fields the form shows and keeps
  // every other attribute of the record (comment, tags, settings, ...).
  rpc UpdateCloudflareDNSRecord(UpdateCloudflareDNSRecordRequest) returns (UpdateCloudflareDNSRecordResponse);
  // SetCloudflareDNSRecordProxied changes only the proxy status.
  rpc SetCloudflareDNSRecordProxied(SetCloudflareDNSRecordProxiedRequest) returns (SetCloudflareDNSRecordProxiedResponse);
  rpc DeleteCloudflareDNSRecord(DeleteCloudflareDNSRecordRequest) returns (DeleteCloudflareDNSRecordResponse);
  // ListCloudflareDNSOperations lists the DNS changes started from Neo Box
  // for a connection (and Zone), newest first.
  rpc ListCloudflareDNSOperations(ListCloudflareDNSOperationsRequest) returns (ListCloudflareDNSOperationsResponse);
  rpc ListCloudflareWorkers(ListCloudflareWorkersRequest) returns (ListCloudflareWorkersResponse);
  rpc ListCloudflarePagesProjects(ListCloudflarePagesProjectsRequest) returns (ListCloudflarePagesProjectsResponse);
  // ListCloudflareTunnels pages through the Account's cloudflared Tunnels,
  // optionally those whose name contains query.
  rpc ListCloudflareTunnels(ListCloudflareTunnelsRequest) returns (ListCloudflareTunnelsResponse);
  // GetCloudflareTunnel reads a Tunnel with its connectors and public
  // hostnames. A part that could not be read is reported in issues.
  rpc GetCloudflareTunnel(GetCloudflareTunnelRequest) returns (GetCloudflareTunnelResponse);
  // CreateCloudflareTunnel creates a remotely managed Tunnel, whose
  // hostnames are edited here and whose cloudflared runs with a token.
  rpc CreateCloudflareTunnel(CreateCloudflareTunnelRequest) returns (CreateCloudflareTunnelResponse);
  // DeleteCloudflareTunnel deletes a Tunnel. Cloudflare refuses while
  // cloudflared is connected. DNS records pointing at it are left alone.
  rpc DeleteCloudflareTunnel(DeleteCloudflareTunnelRequest) returns (DeleteCloudflareTunnelResponse);
  // GetCloudflareTunnelToken returns the credential cloudflared runs the
  // Tunnel with. It is never stored or logged by Neo Box.
  rpc GetCloudflareTunnelToken(GetCloudflareTunnelTokenRequest) returns (GetCloudflareTunnelTokenResponse);
  // CleanupCloudflareTunnelConnections closes a Tunnel's stale connections.
  rpc CleanupCloudflareTunnelConnections(CleanupCloudflareTunnelConnectionsRequest) returns (CleanupCloudflareTunnelConnectionsResponse);
  // AddCloudflareTunnelHostname routes a public hostname to a service of a
  // remotely managed Tunnel, and can create its DNS record.
  rpc AddCloudflareTunnelHostname(AddCloudflareTunnelHostnameRequest) returns (AddCloudflareTunnelHostnameResponse);
  // UpdateCloudflareTunnelHostname changes the path and service of a route;
  // its other settings are kept.
  rpc UpdateCloudflareTunnelHostname(UpdateCloudflareTunnelHostnameRequest) returns (UpdateCloudflareTunnelHostnameResponse);
  // DeleteCloudflareTunnelHostname removes a route, and can delete its DNS
  // record when that is a CNAME to this Tunnel.
  rpc DeleteCloudflareTunnelHostname(DeleteCloudflareTunnelHostnameRequest) returns (DeleteCloudflareTunnelHostnameResponse);
}

// CloudflarePageInfo describes one page of a list.
message CloudflarePageInfo {
  // 1-based.
  int32 page = 1;
  int32 page_size = 2;
  int64 total_count = 3;
  int32 total_pages = 4;
}

// CloudflareRecordAccess is what the token may do with a Zone's DNS records,
// as far as Cloudflare says. Cloudflare does not tell an API token's own
// permissions, only the token owner's legacy Zone permissions, which can
// rule edits out but never confirm them.
enum CloudflareRecordAccess {
  CLOUDFLARE_RECORD_ACCESS_UNSPECIFIED = 0;
  // Not known whether the token may change records; Cloudflare refuses
  // changes it does not allow.
  CLOUDFLARE_RECORD_ACCESS_UNKNOWN = 1;
  // Records can be read but not changed; changes are refused.
  CLOUDFLARE_RECORD_ACCESS_READ = 2;
}

message CloudflareZone {
  string id = 1;
  string name = 2;
  // active, pending, initializing, moved, deleted, deactivated.
  string status = 3;
  bool paused = 4;
  // full, partial, secondary, internal.
  string type = 5;
  repeated string name_servers = 6;
  CloudflareRecordAccess dns_access = 7;
}

message CloudflareSRVData {
  int32 priority = 1;
  int32 weight = 2;
  int32 port = 3;
  string target = 4;
}

message CloudflareCAAData {
  int32 flags = 1;
  // issue, issuewild or iodef.
  string tag = 2;
  string value = 3;
}

message CloudflareDNSRecord {
  string id = 1;
  string type = 2;
  string name = 3;
  // For SRV and CAA, Cloudflare's rendering of the structured data.
  string content = 4;
  // Seconds; 1 means automatic.
  int32 ttl = 5;
  bool proxied = 6;
  // Whether Cloudflare can proxy this record.
  bool proxiable = 7;
  // MX priority.
  int32 priority = 8;
  CloudflareSRVData srv = 9;
  CloudflareCAAData caa = 10;
  string comment = 11;
  repeated string tags = 12;
  // Whether Neo Box edits this type (A, AAAA, CNAME, TXT, MX, NS, SRV,
  // CAA); other types are read-only here.
  bool editable = 13;
  google.protobuf.Timestamp created_on = 14;
  google.protobuf.Timestamp modified_on = 15;
}

// CloudflareDNSRecordInput is a record as entered in the form. Fields the
// type does not use are ignored.
message CloudflareDNSRecordInput {
  // Fixed on update.
  string type = 1;
  string name = 2;
  // A, AAAA, CNAME, TXT, MX, NS.
  string content = 3;
  // 1 (automatic) or 30..86400 seconds.
  int32 ttl = 4;
  // A, AAAA and CNAME only.
  bool proxied = 5;
  // MX.
  int32 priority = 6;
  CloudflareSRVData srv = 7;
  CloudflareCAAData caa = 8;
}

enum CloudflareRecordAction {
  CLOUDFLARE_RECORD_ACTION_UNSPECIFIED = 0;
  CLOUDFLARE_RECORD_ACTION_CREATE = 1;
  CLOUDFLARE_RECORD_ACTION_UPDATE = 2;
  CLOUDFLARE_RECORD_ACTION_DELETE = 3;
  CLOUDFLARE_RECORD_ACTION_SET_PROXIED = 4;
}

enum CloudflareOperationStatus {
  CLOUDFLARE_OPERATION_STATUS_UNSPECIFIED = 0;
  // Recorded before the change was sent; no outcome was recorded after it.
  CLOUDFLARE_OPERATION_STATUS_PENDING = 1;
  CLOUDFLARE_OPERATION_STATUS_SUCCEEDED = 2;
  CLOUDFLARE_OPERATION_STATUS_FAILED = 3;
  // Sent, but Cloudflare's answer never arrived (e.g. a timeout); the
  // change may or may not have been made.
  CLOUDFLARE_OPERATION_STATUS_UNKNOWN = 4;
}

// CloudflareDNSOperation is one DNS change started from Neo Box.
message CloudflareDNSOperation {
  string id = 1;
  string connection_id = 2;
  string account_id = 3;
  string zone_id = 4;
  string zone_name = 5;
  CloudflareRecordAction action = 6;
  // Empty for a create that did not succeed.
  string record_id = 7;
  string record_type = 8;
  string record_name = 9;
  // The record before the change; unset for a create.
  CloudflareDNSRecord before = 10;
  // The record Cloudflare returned after the change; unset for a delete
  // and for anything that did not succeed.
  CloudflareDNSRecord after = 11;
  CloudflareOperationStatus status = 12;
  // Why it failed or is unknown.
  string error = 13;
  // Who started it.
  string actor_id = 14;
  string actor_name = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp finished_at = 17;
  // The change as sent to Cloudflare (record fields only); unset for a
  // delete. For a failed or unknown change it is what may have been asked
  // for, never what Cloudflare confirmed.
  google.protobuf.Struct requested = 18;
}

enum CloudflareAddressKind {
  CLOUDFLARE_ADDRESS_KIND_UNSPECIFIED = 0;
  // <script>.<subdomain>.workers.dev
  CLOUDFLARE_ADDRESS_KIND_WORKERS_DEV = 1;
  CLOUDFLARE_ADDRESS_KIND_CUSTOM_DOMAIN = 2;
  // A Worker route pattern; may contain wildcards.
  CLOUDFLARE_ADDRESS_KIND_ROUTE = 3;
  // <project>.pages.dev
  CLOUDFLARE_ADDRESS_KIND_PAGES_DEV = 4;
  // The URL of a Pages project's production deployment.
  CLOUDFLARE_ADDRESS_KIND_PRODUCTION = 5;
}

// CloudflareAddress is one way to reach a Worker or Pages project.
message CloudflareAddress {
  // An https URL, or for a route its pattern as configured.
  string url = 1;
  CloudflareAddressKind kind = 2;
  // A Pages custom domain's status (active, pending, ...), or "unknown"
  // when it could not be read; such a domain may not answer yet.
  string status = 3;
}

// CloudflareAddressIssue says an address source could not be read, so the
// addresses shown may be incomplete.
message CloudflareAddressIssue {
  // e.g. "workers.dev subdomain", "Worker custom domains", "Worker routes".
  string source = 1;
  string message = 2;
  // The token lacks the permission to read the source.
  bool permission_denied = 3;
}

message CloudflareWorker {
  // The script name.
  string name = 1;
  repeated CloudflareAddress addresses = 2;
  // A source of this Worker's addresses could not be read.
  bool addresses_incomplete = 3;
}

message CloudflarePagesProject {
  string name = 1;
  repeated CloudflareAddress addresses = 2;
  bool addresses_incomplete = 3;
}

message ListCloudflareZonesRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Part of the Zone name; empty lists every Zone.
  string query = 2;
  // 1-based; 0 means 1.
  int32 page = 3;
  // 0 means 20; at most 50.
  int32 page_size = 4;
}

message ListCloudflareZonesResponse {
  repeated CloudflareZone zones = 1;
  CloudflarePageInfo page_info = 2;
}

message GetCloudflareZoneRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string zone_id = 2 [(validate.rules).string.min_len = 1];
}

message GetCloudflareZoneResponse {
  CloudflareZone zone = 1;
}

message ListCloudflareDNSRecordsRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string zone_id = 2 [(validate.rules).string.min_len = 1];
  // Matched by Cloudflare against name, content, comment and tags.
  string query = 3;
  // Only records of this type; empty lists every type.
  string type = 4;
  int32 page = 5;
  // 0 means 50; at most 500.
  int32 page_size = 6;
}

message ListCloudflareDNSRecordsResponse {
  repeated CloudflareDNSRecord records = 1;
  CloudflarePageInfo page_info = 2;
}

message CreateCloudflareDNSRecordRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string zone_id = 2 [(validate.rules).string.min_len = 1];
  CloudflareDNSRecordInput record = 3 [(validate.rules).message.required = true];
}

message CreateCloudflareDNSRecordResponse {
  CloudflareDNSRecord record = 1;
  CloudflareDNSOperation operation = 2;
  // Set when the change was made but its outcome could not be added to the
  // operation log, which then shows it as pending.
  string operation_log_error = 3;
}

message UpdateCloudflareDNSRecordRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string zone_id = 2 [(validate.rules).string.min_len = 1];
  string record_id = 3 [(validate.rules).string.min_len = 1];
  CloudflareDNSRecordInput record = 4 [(validate.rules).message.required = true];
}

message UpdateCloudflareDNSRecordResponse {
  CloudflareDNSRecord record = 1;
  CloudflareDNSOperation operation = 2;
  string operation_log_error = 3;
}

message SetCloudflareDNSRecordProxiedRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string zone_id = 2 [(validate.rules).string.min_len = 1];
  string record_id = 3 [(validate.rules).string.min_len = 1];
  bool proxied = 4;
}

message SetCloudflareDNSRecordProxiedResponse {
  CloudflareDNSRecord record = 1;
  CloudflareDNSOperation operation = 2;
  string operation_log_error = 3;
}

message DeleteCloudflareDNSRecordRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string zone_id = 2 [(validate.rules).string.min_len = 1];
  string record_id = 3 [(validate.rules).string.min_len = 1];
}

message DeleteCloudflareDNSRecordResponse {
  CloudflareDNSOperation operation = 1;
  string operation_log_error = 2;
}

message ListCloudflareDNSOperationsRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Only this Zone's operations; empty lists the connection's.
  string zone_id = 2;
  int32 page = 3;
  // 0 means 20; at most 100.
  int32 page_size = 4;
}

message ListCloudflareDNSOperationsResponse {
  repeated CloudflareDNSOperation operations = 1;
  CloudflarePageInfo page_info = 2;
}

message ListCloudflareWorkersRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Part of the script name.
  string query = 2;
  int32 page = 3;
  // 0 means 20; at most 50.
  int32 page_size = 4;
}

message ListCloudflareWorkersResponse {
  repeated CloudflareWorker workers = 1;
  CloudflarePageInfo page_info = 2;
  repeated CloudflareAddressIssue address_issues = 3;
}

message ListCloudflarePagesProjectsRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Part of the project name.
  string query = 2;
  int32 page = 3;
  // 0 means 20; at most 50.
  int32 page_size = 4;
}

message ListCloudflarePagesProjectsResponse {
  repeated CloudflarePagesProject projects = 1;
  CloudflarePageInfo page_info = 2;
  repeated CloudflareAddressIssue address_issues = 3;
}

enum CloudflareTunnelStatus {
  CLOUDFLARE_TUNNEL_STATUS_UNSPECIFIED = 0;
  // Never connected.
  CLOUDFLARE_TUNNEL_STATUS_INACTIVE = 1;
  // Connected, but not at full strength.
  CLOUDFLARE_TUNNEL_STATUS_DEGRADED = 2;
  CLOUDFLARE_TUNNEL_STATUS_HEALTHY = 3;
  // Has connected before, but nothing is connected now.
  CLOUDFLARE_TUNNEL_STATUS_DOWN = 4;
}

message CloudflareTunnel {
  string id = 1;
  string name = 2;
  CloudflareTunnelStatus status = 3;
  // Whether the hostnames are kept at Cloudflare and so can be changed
  // here; false means cloudflared reads a local config file.
  bool managed_remotely = 4;
  // Live connections to Cloudflare's edge.
  int32 active_connections = 5;
  google.protobuf.Timestamp created_at = 6;
  // When it last had a connection, if it has none now.
  google.protobuf.Timestamp inactive_since = 7;
}

message CloudflareTunnelConnection {
  string id = 1;
  // The Cloudflare data center, e.g. "SJC".
  string colo_name = 2;
  string origin_ip = 3;
  bool pending_reconnect = 4;
  google.protobuf.Timestamp opened_at = 5;
}

// CloudflareTunnelConnector is one running cloudflared instance.
message CloudflareTunnelConnector {
  string id = 1;
  string version = 2;
  string arch = 3;
  google.protobuf.Timestamp run_at = 4;
  repeated CloudflareTunnelConnection connections = 5;
}

// CloudflareTunnelHostname is one route of a Tunnel's ingress.
message CloudflareTunnelHostname {
  // Empty when the route matches any hostname.
  string hostname = 1;
  // A regular expression on the request path; empty matches all.
  string path = 2;
  // An origin URL such as http://localhost:8080, or a built-in service
  // (http_status:404, hello_world, bastion, unix:/path).
  string service = 3;
  // The route carries origin settings (originRequest) that are kept as
  // they are when the route changes.
  bool has_origin_settings = 4;
}

// CloudflareReadIssue says part of what is shown could not be read.
message CloudflareReadIssue {
  // e.g. "Tunnel connectors", "Tunnel hostnames".
  string source = 1;
  string message = 2;
  // The token lacks the permission to read it.
  bool permission_denied = 3;
}

// CloudflareTunnelRecordStatus is what became of the DNS record of a
// hostname change. The route changed whatever it says.
enum CloudflareTunnelRecordStatus {
  CLOUDFLARE_TUNNEL_RECORD_STATUS_UNSPECIFIED = 0;
  // No DNS change was asked for.
  CLOUDFLARE_TUNNEL_RECORD_STATUS_NOT_REQUESTED = 1;
  CLOUDFLARE_TUNNEL_RECORD_STATUS_CREATED = 2;
  // The hostname already pointed at the Tunnel.
  CLOUDFLARE_TUNNEL_RECORD_STATUS_EXISTS = 3;
  CLOUDFLARE_TUNNEL_RECORD_STATUS_DELETED = 4;
  // A delete left the record in place; message says why.
  CLOUDFLARE_TUNNEL_RECORD_STATUS_KEPT = 5;
  // The Account has no Zone for the hostname.
  CLOUDFLARE_TUNNEL_RECORD_STATUS_NO_ZONE = 6;
  // The hostname has another record, which was not touched.
  CLOUDFLARE_TUNNEL_RECORD_STATUS_CONFLICT = 7;
  CLOUDFLARE_TUNNEL_RECORD_STATUS_FAILED = 8;
}

message CloudflareTunnelRecordResult {
  CloudflareTunnelRecordStatus status = 1;
  string message = 2;
  string record_id = 3;
}

message ListCloudflareTunnelsRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  // Part of the Tunnel name.
  string query = 2;
  int32 page = 3;
  // 0 means 20; at most 50.
  int32 page_size = 4;
}

message ListCloudflareTunnelsResponse {
  repeated CloudflareTunnel tunnels = 1;
  CloudflarePageInfo page_info = 2;
}

message GetCloudflareTunnelRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
}

message GetCloudflareTunnelResponse {
  CloudflareTunnel tunnel = 1;
  repeated CloudflareTunnelConnector connectors = 2;
  // The routes, in the order cloudflared applies them, without the
  // catch-all. Empty for a Tunnel that is not managed remotely.
  repeated CloudflareTunnelHostname hostnames = 3;
  // Where requests no route matches go; empty when none is configured.
  string catch_all_service = 4;
  // 0 for a Tunnel never configured.
  int32 config_version = 5;
  repeated CloudflareReadIssue issues = 6;
}

message CreateCloudflareTunnelRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string.min_len = 1];
}

message CreateCloudflareTunnelResponse {
  CloudflareTunnel tunnel = 1;
}

message DeleteCloudflareTunnelRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
  // Close stale connections first, which Cloudflare requires before it
  // deletes a Tunnel that still lists any.
  bool cleanup_connections = 3;
}

message DeleteCloudflareTunnelResponse {}

message GetCloudflareTunnelTokenRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
}

message GetCloudflareTunnelTokenResponse {
  // Runs the Tunnel: cloudflared tunnel run --token <token>.
  string token = 1;
}

message CleanupCloudflareTunnelConnectionsRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
}

message CleanupCloudflareTunnelConnectionsResponse {}

message AddCloudflareTunnelHostnameRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
  // A domain name such as app.example.com; the first label may be *.
  string hostname = 3 [(validate.rules).string.min_len = 1];
  // Optional regular expression on the request path.
  string path = 4;
  string service = 5 [(validate.rules).string.min_len = 1];
  // Also point the hostname at the Tunnel with a proxied CNAME, when the
  // Account has its Zone and nothing else is there.
  bool create_dns = 6;
}

message AddCloudflareTunnelHostnameResponse {
  CloudflareTunnelHostname hostname = 1;
  int32 config_version = 2;
  CloudflareTunnelRecordResult record = 3;
}

message UpdateCloudflareTunnelHostnameRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
  // Name the route being changed; the hostname itself cannot change.
  string hostname = 3 [(validate.rules).string.min_len = 1];
  string current_path = 4;
  // The route's new path and service.
  string path = 5;
  string service = 6 [(validate.rules).string.min_len = 1];
}

message UpdateCloudflareTunnelHostnameResponse {
  CloudflareTunnelHostname hostname = 1;
  int32 config_version = 2;
}

message DeleteCloudflareTunnelHostnameRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string tunnel_id = 2 [(validate.rules).string.min_len = 1];
  string hostname = 3 [(validate.rules).string.min_len = 1];
  string path = 4;
  // Also delete the hostname's CNAME to this Tunnel.
  bool delete_dns = 5;
}

message DeleteCloudflareTunnelHostnameResponse {
  int32 config_version = 1;
  CloudflareTunnelRecordResult record = 2;
}

syntax = "proto3";

package neobox.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "go.orx.me/apps/neo-box/pkg/proto/neobox/v1;neoboxv1";

// NocoDBService manages point-in-time Snapshots of the Bases (schema +
// records + links) of NocoDB connections, and Restores of them into new
// Bases. Connections themselves are managed by ConnectionService;
// connection_id here must name a NocoDB connection. Every resource is owned
// by the calling user.
service NocoDBService {
  // ListNocoDBBases lists the Bases visible to the connection's token, each
  // joined with its backup policy and latest snapshot.
  rpc ListNocoDBBases(ListNocoDBBasesRequest) returns (ListNocoDBBasesResponse);

  // Backup policies
  rpc UpsertBackupPolicy(UpsertBackupPolicyRequest) returns (UpsertBackupPolicyResponse);

  // Snapshots
  // CreateSnapshot queues a manual snapshot and returns immediately with a
  // PENDING snapshot; poll GetSnapshot for progress.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  // ListSnapshotRecords pages through the records of one table inside a
  // succeeded snapshot.
  rpc ListSnapshotRecords(ListSnapshotRecordsRequest) returns (ListSnapshotRecordsResponse);

  // Restores
  // RestoreSnapshot queues a restore of a succeeded snapshot into a new Base
  // and returns immediately with a PENDING restore; poll GetRestore for
  // progress. A restore never changes an existing Base.
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);
  rpc GetRestore(GetRestoreRequest) returns (GetRestoreResponse);
  // ListRestores lists restores, newest first.
  rpc ListRestores(ListRestoresRequest) returns (ListRestoresResponse);
}

// BackupPolicy controls scheduled snapshots of one Base.
message BackupPolicy {
  string connection_id = 1;
  string base_id = 2;
  bool enabled = 3;
  // Standard 5-field cron expression evaluated in the server's time zone,
  // e.g. "0 3 * * *" for daily at 03:00.
  string cron = 4;
  // Number of scheduled snapshots to keep; older ones are deleted after a
  // new scheduled snapshot succeeds. 0 keeps everything. Manual snapshots
  // are never pruned.
  int32 retention = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Next scheduled run, when enabled.
  google.protobuf.Timestamp next_run_at = 7;
}

message NocoDBBase {
  string id = 1;
  string title = 2;
  BackupPolicy policy = 3;
  Snapshot latest_snapshot = 4;
}

message ListNocoDBBasesRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
}

message ListNocoDBBasesResponse {
  repeated NocoDBBase bases = 1;
}

message UpsertBackupPolicyRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string base_id = 2 [(validate.rules).string.min_len = 1];
  bool enabled = 3;
  string cron = 4;
  int32 retention = 5 [(validate.rules).int32.gte = 0];
}

message UpsertBackupPolicyResponse {
  BackupPolicy policy = 1;
}

enum SnapshotStatus {
  SNAPSHOT_STATUS_UNSPECIFIED = 0;
  SNAPSHOT_STATUS_PENDING = 1;
  SNAPSHOT_STATUS_RUNNING = 2;
  SNAPSHOT_STATUS_SUCCEEDED = 3;
  SNAPSHOT_STATUS_FAILED = 4;
}

enum SnapshotTrigger {
  SNAPSHOT_TRIGGER_UNSPECIFIED = 0;
  SNAPSHOT_TRIGGER_MANUAL = 1;
  SNAPSHOT_TRIGGER_SCHEDULED = 2;
}

message SnapshotTable {
  string id = 1;
  string title = 2;
  int64 record_count = 3;
  int32 field_count = 4;
  int64 link_count = 5;
}

message Snapshot {
  string id = 1;
  string connection_id = 2;
  string base_id = 3;
  string base_title = 4;
  SnapshotStatus status = 5;
  SnapshotTrigger trigger = 6;
  string error = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  // Compressed size of the stored snapshot content.
  int64 size_bytes = 11;
  int64 record_count = 12;
  int64 link_count = 13;
  repeated SnapshotTable tables = 14;
  // Human-readable progress while RUNNING, e.g. "Orders: 1200 records".
  string progress = 15;
}

message CreateSnapshotRequest {
  string connection_id = 1 [(validate.rules).string.min_len = 1];
  string base_id = 2 [(validate.rules).string.min_len = 1];
}

message CreateSnapshotResponse {
  Snapshot snapshot = 1;
}

message ListSnapshotsRequest {
  // Optional filters.
  string connection_id = 1;
  string base_id = 2;
  int32 limit = 3;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message GetSnapshotRequest {
  string id = 1 [(validate.rules).string.min_len = 1];
}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

message DeleteSnapshotRequest {
  string id = 1 [(validate.rules).string.min_len = 1];
}

message DeleteSnapshotResponse {}

message SnapshotField {
  string id = 1;
  string title = 2;
  string type = 3;
}

message ListSnapshotRecordsRequest {
  string snapshot_id = 1 [(validate.rules).string.min_len = 1];
  string table_id = 2 [(validate.rules).string.min_len = 1];
  // 1-based page number.
  int32 page = 3;
  int32 page_size = 4;
}

message ListSnapshotRecordsResponse {
  repeated SnapshotField fields = 1;
  // Each record is {"id": ..., "fields": {...}} as returned by NocoDB.
  repeated google.protobuf.Struct records = 2;
  int64 total = 3;
}

enum RestoreStatus {
  RESTORE_STATUS_UNSPECIFIED = 0;
  RESTORE_STATUS_PENDING = 1;
  RESTORE_STATUS_RUNNING = 2;
  RESTORE_STATUS_SUCCEEDED = 3;
  RESTORE_STATUS_FAILED = 4;
}

// RestoreWarning groups one kind of loss in one table (and field), e.g.
// code "attachments_skipped" with the number of attachments not restored.
message RestoreWarning {
  // One of field_skipped, attachments_skipped, user_values_dropped,
  // records_failed, links_failed, display_field_not_set, relation_guessed.
  string code = 1;
  string table = 2;
  string field = 3;
  int64 count = 4;
  string message = 5;
}

// Restore is one rebuild of a Snapshot into a new Base. The source fields
// are copied from the snapshot, so they stay readable after it is deleted.
message Restore {
  string id = 1;
  string snapshot_id = 2;
  string source_connection_id = 3;
  string source_base_id = 4;
  string source_base_title = 5;
  string target_connection_id = 6;
  // Set as soon as the new Base exists; a failed restore keeps its
  // partial Base.
  string target_base_id = 7;
  string target_base_title = 8;
  RestoreStatus status = 9;
  string error = 10;
  // Human-readable progress while RUNNING.
  string progress = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  int32 table_count = 15;
  int64 record_count = 16;
  int64 link_count = 17;
  repeated RestoreWarning warnings = 18;
}

message RestoreSnapshotRequest {
  string snapshot_id = 1 [(validate.rules).string.min_len = 1];
  // The NocoDB connection to create the Base on; empty means the
  // snapshot's own connection.
  string target_connection_id = 2;
  // Title of the new Base; empty means
  // "<base title> (restored from <snapshot date, UTC>)". NocoDB allows
  // letters, numbers, spaces, and - _ . ( ) & , ' and at most 150
  // characters.
  string title = 3;
}

message RestoreSnapshotResponse {
  Restore restore = 1;
}

message GetRestoreRequest {
  string id = 1 [(validate.rules).string.min_len = 1];
}

message GetRestoreResponse {
  Restore restore = 1;
}

message ListRestoresRequest {
  // Optional filters. connection_id matches the source or the target.
  string snapshot_id = 1;
  string connection_id = 2;
  int32 limit = 3;
}

message ListRestoresResponse {
  repeated Restore restores = 1;
}

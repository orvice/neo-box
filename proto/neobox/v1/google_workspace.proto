syntax = "proto3";
package neobox.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "neobox/v1/connection.proto";

option go_package = "go.orx.me/apps/neo-box/pkg/proto/neobox/v1;neoboxv1";

// Each connection owns one reusable Service Account and multiple independent tenants.
service GoogleWorkspaceService {
  rpc ListWorkspaceTenants(ListWorkspaceTenantsRequest) returns (ListWorkspaceTenantsResponse);
  rpc CreateWorkspaceTenant(CreateWorkspaceTenantRequest) returns (CreateWorkspaceTenantResponse);
  rpc UpdateWorkspaceTenant(UpdateWorkspaceTenantRequest) returns (UpdateWorkspaceTenantResponse);
  rpc DeleteWorkspaceTenant(DeleteWorkspaceTenantRequest) returns (DeleteWorkspaceTenantResponse);
  rpc TestWorkspaceTenant(TestWorkspaceTenantRequest) returns (TestWorkspaceTenantResponse);
  rpc ListWorkspaceUsers(ListWorkspaceUsersRequest) returns (ListWorkspaceUsersResponse);
  rpc GetWorkspaceUser(GetWorkspaceUserRequest) returns (GetWorkspaceUserResponse);
  rpc CreateWorkspaceUser(CreateWorkspaceUserRequest) returns (CreateWorkspaceUserResponse);
  rpc UpdateWorkspaceUser(UpdateWorkspaceUserRequest) returns (UpdateWorkspaceUserResponse);
  rpc ResetWorkspaceUserPassword(ResetWorkspaceUserPasswordRequest) returns (ResetWorkspaceUserPasswordResponse);
  rpc SetWorkspaceUserSuspended(SetWorkspaceUserSuspendedRequest) returns (SetWorkspaceUserSuspendedResponse);
  rpc ListWorkspaceUserAliases(ListWorkspaceUserAliasesRequest) returns (ListWorkspaceUserAliasesResponse);
  rpc AddWorkspaceUserAlias(AddWorkspaceUserAliasRequest) returns (AddWorkspaceUserAliasResponse);
  rpc DeleteWorkspaceUserAlias(DeleteWorkspaceUserAliasRequest) returns (DeleteWorkspaceUserAliasResponse);
  rpc ListWorkspaceGroups(ListWorkspaceGroupsRequest) returns (ListWorkspaceGroupsResponse);
  rpc ListWorkspaceUserGroups(ListWorkspaceUserGroupsRequest) returns (ListWorkspaceUserGroupsResponse);
  rpc CreateWorkspaceGroup(CreateWorkspaceGroupRequest) returns (CreateWorkspaceGroupResponse);
  rpc UpdateWorkspaceGroup(UpdateWorkspaceGroupRequest) returns (UpdateWorkspaceGroupResponse);
  rpc DeleteWorkspaceGroup(DeleteWorkspaceGroupRequest) returns (DeleteWorkspaceGroupResponse);
  rpc ListWorkspaceGroupMembers(ListWorkspaceGroupMembersRequest) returns (ListWorkspaceGroupMembersResponse);
  rpc AddWorkspaceGroupMember(AddWorkspaceGroupMemberRequest) returns (AddWorkspaceGroupMemberResponse);
  rpc UpdateWorkspaceGroupMember(UpdateWorkspaceGroupMemberRequest) returns (UpdateWorkspaceGroupMemberResponse);
  rpc DeleteWorkspaceGroupMember(DeleteWorkspaceGroupMemberRequest) returns (DeleteWorkspaceGroupMemberResponse);
  rpc ListWorkspaceOrgUnits(ListWorkspaceOrgUnitsRequest) returns (ListWorkspaceOrgUnitsResponse);
  rpc CreateWorkspaceOrgUnit(CreateWorkspaceOrgUnitRequest) returns (CreateWorkspaceOrgUnitResponse);
  rpc UpdateWorkspaceOrgUnit(UpdateWorkspaceOrgUnitRequest) returns (UpdateWorkspaceOrgUnitResponse);
  rpc DeleteWorkspaceOrgUnit(DeleteWorkspaceOrgUnitRequest) returns (DeleteWorkspaceOrgUnitResponse);
  rpc SignOutWorkspaceUser(SignOutWorkspaceUserRequest) returns (SignOutWorkspaceUserResponse);
  rpc ListWorkspaceUserTokens(ListWorkspaceUserTokensRequest) returns (ListWorkspaceUserTokensResponse);
  rpc RevokeWorkspaceUserToken(RevokeWorkspaceUserTokenRequest) returns (RevokeWorkspaceUserTokenResponse);
  rpc ListWorkspaceOperations(ListWorkspaceOperationsRequest) returns (ListWorkspaceOperationsResponse);
  rpc GetWorkspaceOverview(GetWorkspaceOverviewRequest) returns (GetWorkspaceOverviewResponse);
  rpc ListWorkspaceAuditActivities(ListWorkspaceAuditActivitiesRequest) returns (ListWorkspaceAuditActivitiesResponse);
  // Gmail settings are read and changed by impersonating one tenant user
  // (ADR 0008). Settings requests never read message content.
  rpc GetWorkspaceUserGmailSettings(GetWorkspaceUserGmailSettingsRequest) returns (GetWorkspaceUserGmailSettingsResponse);
  rpc UpdateWorkspaceUserGmailVacation(UpdateWorkspaceUserGmailVacationRequest) returns (UpdateWorkspaceUserGmailVacationResponse);
  // Gmail mail is read-only (ADR 0010): labels, search, one message and one
  // attachment, read live by impersonating the user with gmail.readonly. Each
  // call carries the same access confirmation and is logged before it is sent;
  // nothing changes the mailbox.
  rpc ListWorkspaceUserGmailLabels(ListWorkspaceUserGmailLabelsRequest) returns (ListWorkspaceUserGmailLabelsResponse);
  rpc SearchWorkspaceUserGmailMessages(SearchWorkspaceUserGmailMessagesRequest) returns (SearchWorkspaceUserGmailMessagesResponse);
  rpc GetWorkspaceUserGmailMessage(GetWorkspaceUserGmailMessageRequest) returns (GetWorkspaceUserGmailMessageResponse);
  rpc DownloadWorkspaceUserGmailAttachment(DownloadWorkspaceUserGmailAttachmentRequest) returns (DownloadWorkspaceUserGmailAttachmentResponse);
  // Drive governance reads Google's Reports API only (ADR 0009); no file
  // content is reachable with these scopes.
  rpc ListWorkspaceDriveActivities(ListWorkspaceDriveActivitiesRequest) returns (ListWorkspaceDriveActivitiesResponse);
  rpc ListWorkspaceDriveUsage(ListWorkspaceDriveUsageRequest) returns (ListWorkspaceDriveUsageResponse);
  // Shared drive inventory (drives.list as the tenant's administrator).
  // Needs drive.readonly, a scope that could read file content; Neo Box
  // calls only drives.list and records each read with its reason first. See
  // docs/adr/0009.
  rpc ListWorkspaceSharedDrives(ListWorkspaceSharedDrivesRequest) returns (ListWorkspaceSharedDrivesResponse);
  // One user's files that are visible beyond named people (files.list as that
  // user, drive.metadata.readonly: metadata only). Reason and typed primary
  // email on every request, recorded first. See docs/adr/0009.
  rpc ListWorkspaceUserExposedFiles(ListWorkspaceUserExposedFilesRequest) returns (ListWorkspaceUserExposedFilesResponse);
  // One user's storage and Gmail activity per day, from Google's usage
  // reports (admin.reports.usage.readonly). Aggregate figures only: it never
  // reads the mailbox, so it needs no access reason and is not recorded.
  rpc GetWorkspaceUserUsage(GetWorkspaceUserUsageRequest) returns (GetWorkspaceUserUsageResponse);
  // Every user's storage (Gmail, Drive, Photos, total, quota) from the newest
  // usage report, joined with the Directory for each user's organizational
  // unit and summarised per unit. Read-only: the quota shown is what Google
  // reports; Google has no API to set a user storage limit, which stays in the
  // Admin console.
  rpc ListWorkspaceStorageUsage(ListWorkspaceStorageUsageRequest) returns (ListWorkspaceStorageUsageResponse);
}
message WorkspaceTenant {
  string id = 1;
  string connection_id = 2;
  string name = 3;
  string customer_id = 4;
  string delegated_admin_email = 5;
  ConnectionStatus status = 6;
  string status_message = 7;
  google.protobuf.Timestamp status_checked_at = 8;
}
message WorkspaceUser {
  string id = 1;
  string primary_email = 2;
  string given_name = 3;
  string family_name = 4;
  string org_unit_path = 5;
  bool suspended = 6;
  bool is_admin = 7;
  bool change_password_at_next_login = 8;
  string customer_id = 9;
  optional bool super_admin = 10;
  optional bool delegated_admin = 11;
  optional bool two_step_enrolled = 12;
  optional bool two_step_enforced = 13;
  string last_login_time = 14;
  string creation_time = 15;
}
message WorkspaceUserProfile {
  string given_name = 1;
  string family_name = 2;
  string org_unit_path = 3;
}
message ListWorkspaceTenantsRequest {
  string connection_id = 1;
}
message ListWorkspaceTenantsResponse {
  repeated WorkspaceTenant tenants = 1;
}
message CreateWorkspaceTenantRequest {
  string connection_id = 1;
  string name = 2;
  string customer_id = 3;
  string delegated_admin_email = 4;
}
message CreateWorkspaceTenantResponse {

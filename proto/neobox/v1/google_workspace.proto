syntax = "proto3";
package neobox.v1;

import "google/protobuf/timestamp.proto";
import "neobox/v1/connection.proto";

option go_package = "go.orx.me/apps/neo-box/pkg/proto/neobox/v1;neoboxv1";

// Each connection owns one reusable Service Account and multiple independent tenants.
service GoogleWorkspaceService {
  rpc ListWorkspaceTenants(ListWorkspaceTenantsRequest) returns (ListWorkspaceTenantsResponse);
  rpc CreateWorkspaceTenant(CreateWorkspaceTenantRequest) returns (CreateWorkspaceTenantResponse);
  rpc UpdateWorkspaceTenant(UpdateWorkspaceTenantRequest) returns (UpdateWorkspaceTenantResponse);
  rpc DeleteWorkspaceTenant(DeleteWorkspaceTenantRequest) returns (DeleteWorkspaceTenantResponse);
  rpc TestWorkspaceTenant(TestWorkspaceTenantRequest) returns (TestWorkspaceTenantResponse);
  rpc ListWorkspaceUsers(ListWorkspaceUsersRequest) returns (ListWorkspaceUsersResponse);
  rpc GetWorkspaceUser(GetWorkspaceUserRequest) returns (GetWorkspaceUserResponse);
  rpc CreateWorkspaceUser(CreateWorkspaceUserRequest) returns (CreateWorkspaceUserResponse);
  rpc UpdateWorkspaceUser(UpdateWorkspaceUserRequest) returns (UpdateWorkspaceUserResponse);
  rpc ResetWorkspaceUserPassword(ResetWorkspaceUserPasswordRequest) returns (ResetWorkspaceUserPasswordResponse);
  rpc SetWorkspaceUserSuspended(SetWorkspaceUserSuspendedRequest) returns (SetWorkspaceUserSuspendedResponse);
  rpc ListWorkspaceUserAliases(ListWorkspaceUserAliasesRequest) returns (ListWorkspaceUserAliasesResponse);
  rpc AddWorkspaceUserAlias(AddWorkspaceUserAliasRequest) returns (AddWorkspaceUserAliasResponse);
  rpc DeleteWorkspaceUserAlias(DeleteWorkspaceUserAliasRequest) returns (DeleteWorkspaceUserAliasResponse);
  rpc ListWorkspaceGroups(ListWorkspaceGroupsRequest) returns (ListWorkspaceGroupsResponse);
  rpc ListWorkspaceUserGroups(ListWorkspaceUserGroupsRequest) returns (ListWorkspaceUserGroupsResponse);
  rpc CreateWorkspaceGroup(CreateWorkspaceGroupRequest) returns (CreateWorkspaceGroupResponse);
  rpc UpdateWorkspaceGroup(UpdateWorkspaceGroupRequest) returns (UpdateWorkspaceGroupResponse);
  rpc DeleteWorkspaceGroup(DeleteWorkspaceGroupRequest) returns (DeleteWorkspaceGroupResponse);
  rpc ListWorkspaceGroupMembers(ListWorkspaceGroupMembersRequest) returns (ListWorkspaceGroupMembersResponse);
  rpc AddWorkspaceGroupMember(AddWorkspaceGroupMemberRequest) returns (AddWorkspaceGroupMemberResponse);
  rpc UpdateWorkspaceGroupMember(UpdateWorkspaceGroupMemberRequest) returns (UpdateWorkspaceGroupMemberResponse);
  rpc DeleteWorkspaceGroupMember(DeleteWorkspaceGroupMemberRequest) returns (DeleteWorkspaceGroupMemberResponse);
  rpc ListWorkspaceOrgUnits(ListWorkspaceOrgUnitsRequest) returns (ListWorkspaceOrgUnitsResponse);
  rpc CreateWorkspaceOrgUnit(CreateWorkspaceOrgUnitRequest) returns (CreateWorkspaceOrgUnitResponse);
  rpc UpdateWorkspaceOrgUnit(UpdateWorkspaceOrgUnitRequest) returns (UpdateWorkspaceOrgUnitResponse);
  rpc DeleteWorkspaceOrgUnit(DeleteWorkspaceOrgUnitRequest) returns (DeleteWorkspaceOrgUnitResponse);
  rpc SignOutWorkspaceUser(SignOutWorkspaceUserRequest) returns (SignOutWorkspaceUserResponse);
  rpc ListWorkspaceUserTokens(ListWorkspaceUserTokensRequest) returns (ListWorkspaceUserTokensResponse);
  rpc RevokeWorkspaceUserToken(RevokeWorkspaceUserTokenRequest) returns (RevokeWorkspaceUserTokenResponse);
}
message WorkspaceTenant {
  string id = 1;
  string connection_id = 2;
  string name = 3;
  string customer_id = 4;
  string delegated_admin_email = 5;
  ConnectionStatus status = 6;
  string status_message = 7;
  google.protobuf.Timestamp status_checked_at = 8;
}
message WorkspaceUser {
  string id = 1;
  string primary_email = 2;
  string given_name = 3;
  string family_name = 4;
  string org_unit_path = 5;
  bool suspended = 6;
  bool is_admin = 7;
  bool change_password_at_next_login = 8;
  string customer_id = 9;
}
message WorkspaceUserProfile {
  string given_name = 1;
  string family_name = 2;
  string org_unit_path = 3;
}
message ListWorkspaceTenantsRequest {
  string connection_id = 1;
}
message ListWorkspaceTenantsResponse {
  repeated WorkspaceTenant tenants = 1;
}
message CreateWorkspaceTenantRequest {
  string connection_id = 1;
  string name = 2;
  string customer_id = 3;
  string delegated_admin_email = 4;
}
message CreateWorkspaceTenantResponse {
  WorkspaceTenant tenant = 1;
}
message UpdateWorkspaceTenantRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string name = 3;
  string delegated_admin_email = 4;
}
message UpdateWorkspaceTenantResponse {
  WorkspaceTenant tenant = 1;
}
message DeleteWorkspaceTenantRequest {
  string connection_id = 1;
  string tenant_id = 2;
}
message DeleteWorkspaceTenantResponse {}
message TestWorkspaceTenantRequest {
  string connection_id = 1;
  string tenant_id = 2;
}
message TestWorkspaceTenantResponse {
  WorkspaceTenant tenant = 1;
}
message ListWorkspaceUsersRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string query = 3;
  string page_token = 4;
  int32 page_size = 5;
}
message ListWorkspaceUsersResponse {
  repeated WorkspaceUser users = 1;
  string next_page_token = 2;
}
message GetWorkspaceUserRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
}
message GetWorkspaceUserResponse {
  WorkspaceUser user = 1;
}
message CreateWorkspaceUserRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string primary_email = 3;
  WorkspaceUserProfile profile = 4;
  string password = 5;
  bool change_password_at_next_login = 6;
}
message CreateWorkspaceUserResponse {
  WorkspaceUser user = 1;
}
message UpdateWorkspaceUserRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  WorkspaceUserProfile profile = 4;
}
message UpdateWorkspaceUserResponse {
  WorkspaceUser user = 1;
}
message ResetWorkspaceUserPasswordRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string password = 4;
  bool change_password_at_next_login = 5;
}
message ResetWorkspaceUserPasswordResponse {
  WorkspaceUser user = 1;
}
message SetWorkspaceUserSuspendedRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  bool suspended = 4;
}
message SetWorkspaceUserSuspendedResponse {
  WorkspaceUser user = 1;
}

message WorkspaceAlias {
  string email = 1;
  bool editable = 2;
}

message WorkspaceGroup {
  string id = 1;
  string email = 2;
  string name = 3;
  string description = 4;
  string direct_member_count = 5;
}

message WorkspaceGroupInput {
  string email = 1;
  string name = 2;
  string description = 3;
}

message WorkspaceGroupMember {
  string id = 1;
  string email = 2;
  string role = 3;
  string type = 4;
  string status = 5;
}

message WorkspaceOrgUnit {
  string id = 1;
  string name = 2;
  string description = 3;
  string path = 4;
  string parent_path = 5;
}

message WorkspaceOrgUnitInput {
  string name = 1;
  string description = 2;
  string parent_path = 3;
}

message WorkspaceUserToken {
  string client_id = 1;
  string display_text = 2;
  repeated string scopes = 3;
  bool anonymous = 4;
  bool native_app = 5;
}

message ListWorkspaceUserAliasesRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
}

message ListWorkspaceUserAliasesResponse {
  repeated WorkspaceAlias aliases = 1;
}

message AddWorkspaceUserAliasRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string alias = 4;
}

message AddWorkspaceUserAliasResponse {
  WorkspaceAlias alias = 1;
}

message DeleteWorkspaceUserAliasRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string alias = 4;
}

message DeleteWorkspaceUserAliasResponse {}

message ListWorkspaceGroupsRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string query = 3;
  string page_token = 4;
  int32 page_size = 5;
}

message ListWorkspaceGroupsResponse {
  repeated WorkspaceGroup groups = 1;
  string next_page_token = 2;
}

message ListWorkspaceUserGroupsRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
}

message ListWorkspaceUserGroupsResponse {
  repeated WorkspaceGroup groups = 1;
}

message CreateWorkspaceGroupRequest {
  string connection_id = 1;
  string tenant_id = 2;
  WorkspaceGroupInput group = 3;
}

message CreateWorkspaceGroupResponse {
  WorkspaceGroup group = 1;
}

message UpdateWorkspaceGroupRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string group_id = 3;
  WorkspaceGroupInput group = 4;
}

message UpdateWorkspaceGroupResponse {
  WorkspaceGroup group = 1;
}

message DeleteWorkspaceGroupRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string group_id = 3;
}

message DeleteWorkspaceGroupResponse {}

message ListWorkspaceGroupMembersRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string group_id = 3;
  string page_token = 4;
  int32 page_size = 5;
}

message ListWorkspaceGroupMembersResponse {
  repeated WorkspaceGroupMember members = 1;
  string next_page_token = 2;
}

message AddWorkspaceGroupMemberRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string group_id = 3;
  string email = 4;
  string role = 5;
}

message AddWorkspaceGroupMemberResponse {
  WorkspaceGroupMember member = 1;
}

message UpdateWorkspaceGroupMemberRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string group_id = 3;
  string member_id = 4;
  string role = 5;
}

message UpdateWorkspaceGroupMemberResponse {
  WorkspaceGroupMember member = 1;
}

message DeleteWorkspaceGroupMemberRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string group_id = 3;
  string member_id = 4;
}

message DeleteWorkspaceGroupMemberResponse {}

message ListWorkspaceOrgUnitsRequest {
  string connection_id = 1;
  string tenant_id = 2;
}

message ListWorkspaceOrgUnitsResponse {
  repeated WorkspaceOrgUnit org_units = 1;
}

message CreateWorkspaceOrgUnitRequest {
  string connection_id = 1;
  string tenant_id = 2;
  WorkspaceOrgUnitInput org_unit = 3;
}

message CreateWorkspaceOrgUnitResponse {
  WorkspaceOrgUnit org_unit = 1;
}

message UpdateWorkspaceOrgUnitRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string org_unit_id = 3;
  WorkspaceOrgUnitInput org_unit = 4;
}

message UpdateWorkspaceOrgUnitResponse {
  WorkspaceOrgUnit org_unit = 1;
}

message DeleteWorkspaceOrgUnitRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string org_unit_id = 3;
}

message DeleteWorkspaceOrgUnitResponse {}

message SignOutWorkspaceUserRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
}

message SignOutWorkspaceUserResponse {}

message ListWorkspaceUserTokensRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
}

message ListWorkspaceUserTokensResponse {
  repeated WorkspaceUserToken tokens = 1;
}

message RevokeWorkspaceUserTokenRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string client_id = 4;
}

message RevokeWorkspaceUserTokenResponse {}

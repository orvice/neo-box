}

message WorkspaceAlias {
  string email = 1;
  bool editable = 2;
}

message WorkspaceGroup {
  string id = 1;
  string email = 2;
  string name = 3;
  string description = 4;
  string direct_member_count = 5;
}

message WorkspaceGroupInput {
  string email = 1;
  string name = 2;
  string description = 3;
}

message WorkspaceGroupMember {

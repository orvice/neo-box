// PENDING also covers an interrupted process or a failed outcome-log write.
enum WorkspaceOperationStatus {
  WORKSPACE_OPERATION_STATUS_UNSPECIFIED = 0;
  WORKSPACE_OPERATION_STATUS_PENDING = 1;
  WORKSPACE_OPERATION_STATUS_SUCCEEDED = 2;
  WORKSPACE_OPERATION_STATUS_FAILED = 3;
  WORKSPACE_OPERATION_STATUS_UNKNOWN = 4;
}
message WorkspaceOperation {
  string id = 1;
  string connection_id = 2;
  string tenant_id = 3;
  string tenant_name = 4;
  string customer_id = 5;
  string action = 6;
  string target = 7;
  google.protobuf.Struct requested = 8;
  google.protobuf.Struct result = 9;
  WorkspaceOperationStatus status = 10;
  string error = 11;
  string actor_id = 12;
  string actor_name = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp finished_at = 15;
}
message ListWorkspaceOperationsRequest {
  string connection_id = 1;
  // Empty includes retained history of removed tenants.
  string tenant_id = 2;
  string query = 3;
  WorkspaceOperationStatus status = 4;
  int32 page = 5;
  int32 page_size = 6;
}
message ListWorkspaceOperationsResponse {
  repeated WorkspaceOperation operations = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message WorkspaceTenantSummary {
  string connection_id = 1;
  string connection_name = 2;
  WorkspaceTenant tenant = 3;
  int64 user_count = 4;
  int64 active_count = 5;
  int64 suspended_count = 6;
  int64 admin_count = 7;
  int64 admins_without_two_step = 8;
  int64 inactive_count = 9;
  int64 never_logged_in_count = 10;
  int64 security_unknown_count = 11;
  // Counts describe the users actually observed, not estimated totals.
  bool users_complete = 12;
  string users_error = 13;
  optional int64 group_count = 14;
  bool groups_complete = 15;
  string groups_error = 16;
}
message WorkspaceOverviewUser {
  string connection_id = 1;
  string connection_name = 2;
  string tenant_id = 3;
  string tenant_name = 4;
  WorkspaceUser user = 5;
  bool inactive = 6;
  bool never_logged_in = 7;
  bool admin_without_two_step = 8;
  bool security_unknown = 9;
}
message GetWorkspaceOverviewRequest {
  // Empty reads every Google Workspace connection owned by the caller.
  string connection_id = 1;
  // Requires connection_id when set.
  string tenant_id = 2;
  string query = 3;
  // all, admins, admins_without_two_step, inactive, never_logged_in,
  // suspended or unknown. Empty means all.
  string security_filter = 4;
  int32 inactivity_days = 5;
  bool include_groups = 6;
  int32 page = 7;
  int32 page_size = 8;
}
message GetWorkspaceOverviewResponse {
  repeated WorkspaceTenantSummary tenants = 1;
  repeated WorkspaceOverviewUser users = 2;
  int64 total_count = 3;
  int32 page = 4;
  int32 page_size = 5;
  google.protobuf.Timestamp observed_at = 6;
  bool users_complete = 7;
  WorkspaceSecurityTotals totals = 8;
}
message WorkspaceAuditEvent {
  string name = 1;
  string type = 2;
  google.protobuf.Struct parameters = 3;
}
message WorkspaceAuditActivity {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string application = 3;
  string actor_email = 4;
  string actor_profile_id = 5;
  string ip_address = 6;
  repeated WorkspaceAuditEvent events = 7;
}
message ListWorkspaceAuditActivitiesRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // login, admin, groups, groups_enterprise, token or user_accounts.
  string application = 3;
  // Empty or all reads the customer; otherwise an existing tenant user ID/email.
  string user_key = 4;
  // RFC3339. Empty defaults to the last seven days through now.
  string start_time = 5;
  string end_time = 6;
  string event_name = 7;
  string page_token = 8;
  int32 page_size = 9;
}
message ListWorkspaceAuditActivitiesResponse {
  repeated WorkspaceAuditActivity activities = 1;
  string next_page_token = 2;
  string start_time = 3;
  string end_time = 4;
}

// Counts deduplicated by Customer ID plus immutable user ID across credentials.
message WorkspaceSecurityTotals {
  int64 user_count = 1;
  int64 active_count = 2;
  int64 suspended_count = 3;
  int64 admin_count = 4;
  int64 admins_without_two_step = 5;
  int64 inactive_count = 6;
  int64 never_logged_in_count = 7;
  int64 security_unknown_count = 8;
}

// Required on every Gmail settings request. The backend checks it each time;
// it is accountability, not authorization.
message GmailAccessConfirmation {
  // Why this mailbox's settings are being accessed, 1-200 characters.
  string reason = 1;
  // The target's primary email, typed again. Must equal the resolved user.
  string target_email = 2;
}

// One section of the overview. A section that could not be read says why and
// carries no values; unread is never shown as off.
message GmailSectionState {
  bool ok = 1;
  string error = 2;
}

message GmailVacation {
  GmailSectionState state = 1;
  bool enabled = 2;
  string subject = 3;
  string body_plain_text = 4;
  // The stored body is HTML; saving replaces it with plain text.
  bool body_is_html = 5;
  bool restrict_to_contacts = 6;
  bool restrict_to_domain = 7;
  google.protobuf.Timestamp start_time = 8;
  google.protobuf.Timestamp end_time = 9;
}

message GmailVacationInput {
  bool enabled = 1;
  string subject = 2;
  string body_plain_text = 3;
  bool restrict_to_contacts = 4;
  bool restrict_to_domain = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
}

// external is unset when the tenant's domains could not be read.
message GmailAutoForwarding {
  GmailSectionState state = 1;
  bool enabled = 2;
  string email_address = 3;
  // leaveInInbox, archive, trash or markRead.
  string disposition = 4;
  optional bool external = 5;
}

message GmailForwardingAddress {
  string email = 1;
  // accepted or pending.
  string verification_status = 2;
  optional bool external = 3;
}

message GmailForwardingAddresses {
  GmailSectionState state = 1;
  repeated GmailForwardingAddress addresses = 2;
}

message GmailDelegate {
  string email = 1;
  // accepted, pending, rejected or expired.
  string verification_status = 2;
}

message GmailDelegates {
  GmailSectionState state = 1;
  repeated GmailDelegate delegates = 2;
}

message GmailFilter {
  string id = 1;
  string from = 2;
  string to = 3;
  string subject = 4;
  string query = 5;
  string negated_query = 6;
  bool has_attachment = 7;
  string forward_to = 8;
  optional bool forward_external = 9;
  // Moves matching mail to the trash.
  bool deletes = 10;
  // Removes matching mail from the inbox.
  bool skips_inbox = 11;
}

message GmailFilters {
  GmailSectionState state = 1;
  repeated GmailFilter filters = 2;
}

message GmailSendAs {
  string email = 1;
  string display_name = 2;
  bool is_primary = 3;
  bool is_default = 4;
  bool treat_as_alias = 5;
  // accepted or pending; empty for the primary address.
  string verification_status = 6;
  optional bool external = 7;
}

message GmailSendAsList {
  GmailSectionState state = 1;
  repeated GmailSendAs addresses = 2;
}

message GetWorkspaceUserGmailSettingsRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // Google user ID or primary email; resolved inside the tenant first.
  string user_id = 3;
  GmailAccessConfirmation confirmation = 4;
}

message GetWorkspaceUserGmailSettingsResponse {
  string user_email = 1;
  GmailVacation vacation = 2;
  GmailAutoForwarding auto_forwarding = 3;
  GmailForwardingAddresses forwarding_addresses = 4;
  GmailDelegates delegates = 5;
  GmailFilters filters = 6;
  GmailSendAsList send_as = 7;
  google.protobuf.Timestamp read_at = 8;
}

message UpdateWorkspaceUserGmailVacationRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  GmailAccessConfirmation confirmation = 4;
  GmailVacationInput vacation = 5;
}

message UpdateWorkspaceUserGmailVacationResponse {
  GmailVacation vacation = 1;
}

// ---- Gmail mail (ADR 0010) ----

message GmailMailLabel {
  string id = 1;
  string name = 2;
  // system or user.
  string type = 3;
  // False when Gmail would not give this label's counts; they are then
  // unknown, not zero.
  bool counts_known = 4;
  int32 messages_total = 5;
  int32 messages_unread = 6;
}

message ListWorkspaceUserGmailLabelsRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // Google user ID or primary email; resolved inside the tenant first.
  string user_id = 3;
  GmailAccessConfirmation confirmation = 4;
}

message ListWorkspaceUserGmailLabelsResponse {
  string user_email = 1;
  repeated GmailMailLabel labels = 2;
  google.protobuf.Timestamp read_at = 3;
}

// One search result. When unavailable is set, Gmail would not give this
// message's headers and the other fields (except ids) are empty.
message GmailMessageSummary {
  string id = 1;
  string thread_id = 2;
  string from = 3;
  string to = 4;
  string subject = 5;
  string snippet = 6;
  google.protobuf.Timestamp date = 7;
  repeated string label_ids = 8;
  // A hint from the message's structure; use has:attachment to search.
  bool has_attachment = 9;
  bool unavailable = 10;
}

message SearchWorkspaceUserGmailMessagesRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  GmailAccessConfirmation confirmation = 4;
  // Gmail search syntax; empty lists recent mail. At most 1000 characters.
  string query = 5;
  // Only messages with all of these labels. At most 10.
  repeated string label_ids = 6;
  bool include_spam_trash = 7;
  string page_token = 8;
  // 1-50; 0 means 25.
  int32 page_size = 9;
}

message SearchWorkspaceUserGmailMessagesResponse {
  string user_email = 1;
  repeated GmailMessageSummary messages = 2;
  string next_page_token = 3;
  // Gmail's estimate of all matches, not a count.
  int32 result_size_estimate = 4;
  google.protobuf.Timestamp read_at = 5;
}

message GmailAttachment {
  // Names the attachment for a download; Gmail's own attachment IDs change.
  string part_id = 1;
  string filename = 2;
  string mime_type = 3;
  int64 size = 4;
  // Images and other parts the HTML refers to; listed, not rendered.
  bool inline = 5;
  // False when Gmail gave the part no attachment ID.
  bool downloadable = 6;
  // Larger than Neo Box's 25 MB limit; a download is refused.
  bool too_large = 7;
}

message GmailMessage {
  string id = 1;
  string thread_id = 2;
  string from = 3;
  string to = 4;
  string cc = 5;
  string bcc = 6;
  string reply_to = 7;
  string subject = 8;
  google.protobuf.Timestamp date = 9;
  repeated string label_ids = 10;
  string snippet = 11;
  string plain_text = 12;
  // Untrusted markup. It must only be shown inside a sandbox that blocks
  // scripts and every external request.
  string html = 13;
  // plain_text was made from html because the message has no text part.
  bool plain_text_from_html = 14;
  // A body was cut at 2 MiB.
  bool body_truncated = 15;
  repeated GmailAttachment attachments = 16;
}

message GetWorkspaceUserGmailMessageRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  GmailAccessConfirmation confirmation = 4;
  string message_id = 5;
}

message GetWorkspaceUserGmailMessageResponse {
  string user_email = 1;
  GmailMessage message = 2;
  google.protobuf.Timestamp read_at = 3;
}

message DownloadWorkspaceUserGmailAttachmentRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  GmailAccessConfirmation confirmation = 4;
  string message_id = 5;
  // GmailAttachment.part_id.
  string part_id = 6;
}

// The file is held in memory for this response only and never stored.
message DownloadWorkspaceUserGmailAttachmentResponse {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
}

// A Drive audit event. A field Google did not report is empty.
message WorkspaceDriveEvent {
  string name = 1;
  string doc_id = 2;
  string doc_title = 3;
  string doc_type = 4;
  string owner = 5;
  bool owner_is_shared_drive = 6;
  string shared_drive_id = 7;
  // Unset when Google did not say whether this is a user's direct action.
  optional bool primary = 8;
  // Google's visibility values, e.g. public_on_the_web, people_with_link,
  // shared_externally, shared_internally, private.
  string visibility = 9;
  string old_visibility = 10;
  // external, internal or none.
  string visibility_change = 11;
  string target_user = 12;
  string target_domain = 13;
  string target = 14;
  string old_role = 15;
  string new_role = 16;
  string new_owner = 17;
  string membership_change_type = 18;
  string added_role = 19;
  string removed_role = 20;
  // All parameters as Google reported them, credentials redacted.
  google.protobuf.Struct parameters = 21;
}

message WorkspaceDriveActivity {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_email = 3;
  string actor_profile_id = 4;
  string ip_address = 5;
  repeated WorkspaceDriveEvent events = 6;
}

message ListWorkspaceDriveActivitiesRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // all, public_web, link_sharing, external_share, ownership, downloads,
  // deletions, trash, shared_drive_members or shared_drive_settings. Empty is all.
  string preset = 3;
  // Empty reads the customer; otherwise an existing tenant user ID or email.
  string user_key = 4;
  // RFC3339. Empty defaults to the last seven days through now.
  string start_time = 5;
  string end_time = 6;
  string page_token = 7;
  int32 page_size = 8;
  // Show side-effect events too, not only a user's direct actions.
  bool include_side_effects = 9;
}

message ListWorkspaceDriveActivitiesResponse {
  repeated WorkspaceDriveActivity activities = 1;
  string next_page_token = 2;
  string start_time = 3;
  string end_time = 4;
  // Side-effect events left out of this page.
  int32 hidden_event_count = 5;
}

// Figures Google did not report are unset, never zero.
message WorkspaceDriveUsageUser {
  string email = 1;
  optional int64 used_mb = 2;
  optional int64 total_mb = 3;
  // Drive's share of the user's total quota; unset when either figure is
  // unknown or the quota is unlimited.
  optional double share_percent = 4;
}

message ListWorkspaceDriveUsageRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string query = 3;
  // used (largest first, unknown last) or email. Empty is used.
  string sort = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListWorkspaceDriveUsageResponse {
  // False when Google has no usage report for the last few days.
  bool has_data = 1;
  // The report day, YYYY-MM-DD. Usage lags by days; it is not today.
  string date = 2;
  repeated WorkspaceDriveUsageUser users = 3;
  // Users matching the query.
  int64 total_count = 4;
  int32 page = 5;
  int32 page_size = 6;
  // Sum of the known used figures across every user read, in MB.
  int64 total_used_mb = 7;
  // Users read, and how many of them have no used figure.
  int64 users_read = 8;
  int64 unknown_used_count = 9;
  bool partial = 10;
  string partial_reason = 11;
}

message ListWorkspaceSharedDrivesRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // Why the inventory is being read, 1-200 characters, single line. Stored on
  // the operation.
  string reason = 3;
  // Shared drives whose name starts with this text (optional, 100 characters).
  string name_prefix = 4;
  // Only drives with no organizer.
  bool no_organizer = 5;
  // Only drives with at most this many members (users and groups). Unset is
  // no limit.
  optional int32 max_members = 6;
  // Only drives in this organizational unit ID (optional).
  string org_unit_id = 7;
  string page_token = 8;
  // 1-100. Empty is 50.
  int32 page_size = 9;
}

// Restrictions Google reported as set. A restriction Google did not return is
// not listed as off.
message WorkspaceSharedDriveRestrictions {
  bool domain_users_only = 1;
  bool drive_members_only = 2;
  bool admin_managed_restrictions = 3;
  bool copy_requires_writer_permission = 4;
  bool sharing_folders_requires_organizer_permission = 5;
}

message WorkspaceSharedDrive {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_time = 3;
  // An opaque ID, not a path; Google returns it only to administrators.
  string org_unit_id = 4;
  WorkspaceSharedDriveRestrictions restrictions = 5;
}

message ListWorkspaceSharedDrivesResponse {
  repeated WorkspaceSharedDrive drives = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp read_at = 3;
}

// Required on every request that reads one user's Drive files. The backend
// checks it each time; it is accountability, not authorization.
message DriveAccessConfirmation {
  // Why this user's files are being listed, 1-200 characters.
  string reason = 1;
  // The target's primary email, typed again. Must equal the resolved user.
  string target_email = 2;
}

message ListWorkspaceUserExposedFilesRequest {
  string connection_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  DriveAccessConfirmation confirmation = 4;
  // Any of anyone_can_find, anyone_with_link, domain_can_find,
  // domain_with_link. Empty is all four.
  repeated string exposures = 5;
  string page_token = 6;
  // 1-100. Empty is 50.
  int32 page_size = 7;
}

// One way a file is open beyond named people, from its permissions.
message WorkspaceFileExposure {
  // anyone_can_find, anyone_with_link, domain_can_find or domain_with_link.
  string kind = 1;
  // reader, commenter or writer, as Google reports it.
  string role = 2;
  // The domain of a domain exposure.
  string domain = 3;
  // Whether a domain exposure is outside the tenant's verified domains. Unset
  // when the domains could not be read; never guessed.
  optional bool external = 4;
}

message WorkspaceExposedFile {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  google.protobuf.Timestamp modified_time = 4;
  string web_view_link = 5;
  // Empty when Google returned no permissions for this file.
  repeated WorkspaceFileExposure exposures = 6;
}

message ListWorkspaceUserExposedFilesResponse {
  string user_email = 1;
  repeated WorkspaceExposedFile files = 2;
  string next_page_token = 3;
  // Google could not search everything; results may be missing.
  bool incomplete_search = 4;
  google.protobuf.Timestamp read_at = 5;
}

// One day of a user's usage report. A figure Google did not report is unset,
// never zero.
message WorkspaceUserUsageDay {
  // The report day, YYYY-MM-DD.
  string date = 1;
  // Storage in MB.
  optional int64 gmail_used_mb = 2;
  optional int64 drive_used_mb = 3;
  optional int64 photos_used_mb = 4;
  optional int64 used_mb = 5;
  // Unset or non-positive when the quota is unknown or unlimited.
  optional int64 total_mb = 6;
  // Gmail message counts for the day.
  optional int64 emails_received = 7;
  optional int64 emails_sent = 8;
  optional int64 spam_received = 9;
}

message GetWorkspaceUserUsageRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // Google user ID or primary email; resolved inside the tenant first.
  string user_id = 3;
  // How many days back from yesterday to look, 1-30. Empty is 14.
  int32 days = 4;
}

message GetWorkspaceUserUsageResponse {
  string user_email = 1;
  // Days Google has a report for, oldest first. Usage lags by a few days, so
  // the newest day is not today; days without a report are left out.
  repeated WorkspaceUserUsageDay days = 2;
  // Days asked for, including those with no report.
  int32 days_requested = 3;
}

// A figure Google did not report is unset, never zero.
message WorkspaceStorageUser {
  string email = 1;
  string name = 2;
  // The user's organizational unit; empty when the Directory read did not
  // include this user.
  string org_unit_path = 3;
  optional int64 gmail_mb = 4;
  optional int64 drive_mb = 5;
  optional int64 photos_mb = 6;
  // Google's total, or the sum of the parts it gave when it gave no total.
  optional int64 used_mb = 7;
  // The quota Google reports for the user. Zero or unset: no limit reported.
  optional int64 quota_mb = 8;
  // used / quota, 0-100+. Unset when either figure is unknown or there is no
  // limit.
  optional double used_percent = 9;
}

// One organizational unit's users, counted where they sit directly.
message WorkspaceStorageOrgUnit {
  string path = 1;
  int64 user_count = 2;
  // Sum of the known used figures, in MB.
  int64 used_mb = 3;
  // Users with no used figure.
  int64 unknown_count = 4;
  // The largest single user's used figure, in MB.
  int64 largest_used_mb = 5;
  // The quota every user in the unit reports, when they all report the same
  // one. Unset when quotas differ or none is reported.
  optional int64 quota_mb = 6;
  bool quota_mixed = 7;
  // Users at or above the request's threshold but under their quota, and
  // users at or over their quota.
  int64 near_limit_count = 8;
  int64 over_limit_count = 9;
}

message ListWorkspaceStorageUsageRequest {
  string connection_id = 1;
  string tenant_id = 2;
  // Substring of the email or name.
  string query = 3;
  // Only users directly in this organizational unit. Empty: every unit.
  string org_unit_path = 4;
  // used (largest first), percent (fullest first, unknown last) or email.
  // Empty is used.
  string sort = 5;
  // 1-100. Empty is 80.
  int32 threshold_percent = 6;
  // Only users at or above the threshold.
  bool only_near_limit = 7;
  int32 page = 8;
  int32 page_size = 9;
}

message ListWorkspaceStorageUsageResponse {
  // False when Google has no usage report for the last few days.
  bool has_data = 1;
  // The report day, YYYY-MM-DD. Usage lags by days.
  string date = 2;
  repeated WorkspaceStorageUser users = 3;
  // Users matching the filters.
  int64 total_count = 4;
  int32 page = 5;
  int32 page_size = 6;
  // Across every user read, ignoring the filters:
  int64 users_read = 7;
  int64 total_used_mb = 8;
  // Users with no used figure, no quota reported, and the threshold applied.
  int64 unknown_used_count = 9;
  int64 no_limit_count = 10;
  int32 threshold_percent = 11;
  int64 near_limit_count = 12;
  int64 over_limit_count = 13;
  repeated WorkspaceStorageOrgUnit org_units = 14;
  // True when the usage read stopped early, or the Directory read did, so some
  // users may be missing or have no organizational unit.
  bool partial = 15;
  string partial_reason = 16;
}

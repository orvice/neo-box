# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: golangci-lint (v2)
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.11.4
        args: --config=.golangci.yml


  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neobox
          POSTGRES_PASSWORD: neobox
          POSTGRES_DB: neobox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neobox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...

    - name: Test
      env:
        NEOBOX_TEST_POSTGRES_DSN: postgres://neobox:neobox@localhost:5432/neobox?sslmode=disable
      run: go test -v ./...

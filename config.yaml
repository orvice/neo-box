# Neo Box local development configuration. See README.md#configuration for
# a complete, annotated sample. ${VAR} placeholders are not expanded.
# Copy to config/neobox.yaml and set BUTTERFLY_CONFIG_FILE_PATH=config/neobox.yaml

# Logto is the only sign-in provider. Create a SPA and an API resource in
# Logto; register http://localhost:5173/auth/callback and the post-sign-out
# URI http://localhost:5173/sign-in. See docs/logto.md for migration steps.
auth:
  logto:
    endpoint: ""             # e.g. https://identity.example.com
    app_id: ""               # SPA app ID; no client secret
    resource: ""             # API resource identifier, e.g. https://neobox.example.com/api
    owner_subject: ""        # Your Logto user ID (sub), never an email
    data_owner_id: "personal" # Stable business owner; keep after migration
    scopes: ["access"]       # API permission assigned to the owner's Logto role
    adopt_existing_data: false # Set true once to consolidate ALL legacy owners

# PostgreSQL for resource data. db_store names an entry under store.db below
# (default "main"); the schema is migrated on startup.
db_store: "main"

store:
  db:
    main:
      driver: postgres
      host: localhost
      port: 5432
      user: neobox
      password: neobox
      db_name: neobox
      ssl_mode: disable
  # s3:
  #   snapshots:
  #     endpoint: "s3.amazonaws.com"
  #     ak: "..."
  #     sk: "..."
  #     region: "us-east-1"
  #     bucket: "neobox-snapshots"
  #     use_ssl: true
  #     use_path_style: false

# Encrypts stored connection credentials (e.g. NocoDB API tokens). 32 bytes,
# raw, hex, or base64 — e.g. `openssl rand -hex 32`. Required for connections.
crypto:
  encryption_key: ""

# Snapshot content storage. Set s3_store to a key under store.s3 above;
# when empty, content is written to local_dir (development only).
storage:
  s3_store: ""
  key_prefix: "neobox"
  local_dir: "./data/blobs"

# Neo Box local development configuration. See README.md#configuration for
# a complete, annotated sample. ${VAR} placeholders are not expanded.
# Copy to config/neobox.yaml and set BUTTERFLY_CONFIG_FILE_PATH=config/neobox.yaml

# User authentication. On first startup with an empty users collection,
# Neo Box creates this initial admin user. Change the password before deploying.
auth:
  initial_admin_username: "admin"
  initial_admin_password: "change-me"
  session_ttl: 168h
  # Local-dev only. When true, requests are admin-equivalent while no auth
  # repo is wired. Production deployments must leave this false.
  allow_unauthenticated: false
  # Third-party OAuth login providers. Providers with empty credentials are
  # skipped at startup and not exposed via ListOAuthProviders. redirect_url
  # must match the callback URL registered with the provider's OAuth app.
  oauth_providers: {}
  #   github:
  #     client_id: "<github client id>"
  #     client_secret: "<github client secret>"
  #     redirect_url: "http://localhost:5173/auth/oauth/callback/github"
  #     scopes: ["read:user", "user:email"]
  #     display_name: "GitHub"
  #   google:
  #     client_id: "<google client id>"
  #     client_secret: "<google client secret>"
  #     redirect_url: "http://localhost:5173/auth/oauth/callback/google"
  #     scopes: ["openid", "email", "profile"]
  #     display_name: "Google"

# PostgreSQL for users, sessions, and resource data. db_store names an entry
# under store.db below (default "main"); the schema is migrated on startup.
db_store: "main"

store:
  db:
    main:
      driver: postgres
      host: localhost
      port: 5432
      user: neobox
      password: neobox
      db_name: neobox
      ssl_mode: disable
  # s3:
  #   snapshots:
  #     endpoint: "s3.amazonaws.com"
  #     ak: "..."
  #     sk: "..."
  #     region: "us-east-1"
  #     bucket: "neobox-snapshots"
  #     use_ssl: true
  #     use_path_style: false

# Encrypts stored connection credentials (e.g. NocoDB API tokens). 32 bytes,
# raw, hex, or base64 — e.g. `openssl rand -hex 32`. Required for connections.
crypto:
  encryption_key: ""

# Snapshot content storage. Set s3_store to a key under store.s3 above;
# when empty, content is written to local_dir (development only).
storage:
  s3_store: ""
  key_prefix: "neobox"
  local_dir: "./data/blobs"

# NocoDB Base snapshots.
nocodb:
  requests_per_second: 5
  workers: 1
  page_size: 200
  snapshot_timeout: 2h
